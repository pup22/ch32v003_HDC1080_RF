[platformio]
src_dir = .

[env:HDC1080]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git ;ch32v
board = genericCH32V003A4M6
framework = ch32v003fun
upload_protocol = minichlink
build_src_filter = +<HDC1080>
build_flags = -flto -IHDC1080

[env:DS18B20]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git ;ch32v
board = genericCH32V003A4M6
framework = ch32v003fun
upload_protocol = minichlink
build_src_filter = +<DS18B20>
build_flags = -flto -IDS18B20

[env:test_ch32v003]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git ;ch32v
board = genericCH32V003A4M6
framework = ch32v003fun
upload_protocol = minichlink
build_src_filter = +<test_ch32v003>
build_flags = -flto -Ich32v003

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
            ; rc-switch
            ; SmartRC-CC1101-Driver-Lib
monitor_speed = 115200
build_src_filter = +<uno>

[env:nano]
platform = atmelavr
board = uno ; прошивает нано
framework = arduino
monitor_speed = 115200
build_src_filter = +<nano>